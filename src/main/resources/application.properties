# Spring Application Name
spring.application.name=student-management-system

# Server Port
server.port=8080

# Database Connection (PostgreSQL on port 2178)
# We use the default database 'postgres' to ensure connection succeeds out-of-the-box.
# You can override these using environment variables or editing this file directly.
spring.datasource.url=jdbc:postgresql://localhost:2178/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf configuration (disable cache for development)
spring.thymeleaf.cache=false
