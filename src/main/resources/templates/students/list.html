<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::mainContent})}">
<body>
    <div th:fragment="mainContent">
        <div class="custom-card">
            <!-- Search & Actions Bar -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <form th:action="@{/students}" method="get" class="d-flex flex-grow-1" style="max-width: 500px;">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-search text-secondary"></i>
                        </span>
                        <input type="text" name="search" th:value="${searchQuery}" class="form-control border-start-0 ps-0" placeholder="Search students by name or course...">
                        <button type="submit" class="btn btn-primary">Search</button>
                        <a th:if="${searchQuery != null && !searchQuery.isEmpty()}" th:href="@{/students}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>
                </form>
                
                <a th:href="@{/students/new}" class="btn btn-primary d-inline-flex align-items-center gap-2">
                    <i class="bi bi-person-plus-fill"></i> Add Student
                </a>
            </div>

            <!-- Success Alert -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4" role="alert" style="background-color: var(--success-light); color: var(--success-color);">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}">Operation successful.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm mb-4" role="alert" style="background-color: var(--danger-light); color: var(--danger-color);">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Error occurred.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Database Table -->
            <div class="custom-table-container">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>
                                <a th:href="@{/students(search=${searchQuery}, page=${currentPage}, sortBy='enrollmentNo', sortDir=${reverseSortDir})}" class="text-decoration-none text-secondary d-inline-flex align-items-center gap-1">
                                    Enrollment No
                                    <i class="bi" th:classappend="${sortBy == 'enrollmentNo' ? (sortDir == 'asc' ? 'bi-sort-down-alt text-primary' : 'bi-sort-up-alt text-primary') : 'bi-arrow-down-up opacity-25'}"></i>
                                </a>
                            </th>
                            <th>
                                <a th:href="@{/students(search=${searchQuery}, page=${currentPage}, sortBy='name', sortDir=${reverseSortDir})}" class="text-decoration-none text-secondary d-inline-flex align-items-center gap-1">
                                    Name
                                    <i class="bi" th:classappend="${sortBy == 'name' ? (sortDir == 'asc' ? 'bi-sort-alpha-down text-primary' : 'bi-sort-alpha-up text-primary') : 'bi-arrow-down-up opacity-25'}"></i>
                                </a>
                            </th>
                            <th>Email</th>
                            <th>
                                <a th:href="@{/students(search=${searchQuery}, page=${currentPage}, sortBy='course', sortDir=${reverseSortDir})}" class="text-decoration-none text-secondary d-inline-flex align-items-center gap-1">
                                    Course Name
                                    <i class="bi" th:classappend="${sortBy == 'course' ? (sortDir == 'asc' ? 'bi-sort-alpha-down text-primary' : 'bi-sort-alpha-up text-primary') : 'bi-arrow-down-up opacity-25'}"></i>
                                </a>
                            </th>
                            <th>Birth Date</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student : ${students}">
                            <td>
                                <span class="custom-badge badge-primary" th:text="${student.enrollmentNo}">ENR-001</span>
                            </td>
                            <td>
                                <strong th:text="${student.name}">John Doe</strong>
                            </td>
                            <td th:text="${student.email}">john.doe@example.com</td>
                            <td>
                                <span class="custom-badge badge-success" th:text="${student.course}">Computer Science</span>
                            </td>
                            <td th:text="${#temporals.format(student.birthDate, 'dd MMM yyyy')}">01 Jan 2000</td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-2">
                                    <!-- Edit Link -->
                                    <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-outline-primary d-inline-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" title="Edit Student">
                                        <i class="bi bi-pencil-fill"></i>
                                    </a>
                                    <!-- Delete Button (Triggering modal confirmation or post) -->
                                    <form th:action="@{/students/delete/{id}(id=${student.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this student record?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger d-inline-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" title="Delete Student">
                                            <i class="bi bi-trash-fill"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <!-- Empty State -->
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-people text-secondary" style="font-size: 3rem; opacity: 0.3;"></i>
                                <p class="mt-3 mb-1 fw-medium">No Students Found</p>
                                <p class="small text-muted" th:text="${searchQuery != null && !searchQuery.isEmpty() ? 'No records match your search search query.' : 'Register new students to see them listed here.'}">Register students to start managing them.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Controls -->
            <div th:if="${totalPages > 1}" class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-4 pt-3 border-top border-light-subtle">
                <div class="text-secondary small mb-3 mb-md-0">
                    Showing <span class="fw-semibold text-dark" th:text="${currentPage * pageSize + 1}">1</span> to 
                    <span class="fw-semibold text-dark" th:text="${((currentPage + 1) * pageSize) &lt; totalItems ? ((currentPage + 1) * pageSize) : totalItems}">5</span> of 
                    <span class="fw-semibold text-dark" th:text="${totalItems}">10</span> entries
                </div>
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm m-0 gap-1">
                        <!-- Previous Page -->
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link border-0 rounded-2" th:href="@{/students(search=${searchQuery}, page=${currentPage - 1}, sortBy=${sortBy}, sortDir=${sortDir})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo; Prev</span>
                            </a>
                        </li>
                        
                        <!-- Page Numbers -->
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                            <a class="page-link border-0 rounded-2" th:href="@{/students(search=${searchQuery}, page=${i}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="${i + 1}">1</a>
                        </li>
                        
                        <!-- Next Page -->
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link border-0 rounded-2" th:href="@{/students(search=${searchQuery}, page=${currentPage + 1}, sortBy=${sortBy}, sortDir=${sortDir})}" aria-label="Next">
                                <span aria-hidden="true">Next &raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
