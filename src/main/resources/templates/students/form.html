<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::mainContent})}">
<body>
    <div th:fragment="mainContent">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="custom-card">
                    <div class="custom-card-header">
                        <h6 class="custom-card-title" th:text="${student.id == null ? 'Register New Student' : 'Edit Student Details'}">Register New Student</h6>
                        <a th:href="@{/students}" class="btn btn-sm btn-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Back to Database
                        </a>
                    </div>

                    <!-- Add/Edit form -->
                    <form th:action="${student.id == null ? '/students' : '/students/edit/' + student.id}" th:object="${student}" method="post">
                        <!-- Hidden ID for edit mode -->
                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <!-- Enrollment Number -->
                            <div class="col-md-6 form-group">
                                <label for="enrollmentNo" class="form-label">Enrollment Number <span class="text-danger">*</span></label>
                                <input type="text" id="enrollmentNo" th:field="*{enrollmentNo}" class="form-control" placeholder="e.g. ENR-2026-001" th:readonly="${student.id != null}">
                                <div class="text-danger" th:if="${#fields.hasErrors('enrollmentNo')}" th:errors="*{enrollmentNo}"></div>
                            </div>

                            <!-- Full Name -->
                            <div class="col-md-6 form-group">
                                <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. John Doe">
                                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <!-- Email -->
                            <div class="col-md-6 form-group">
                                <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="e.g. john.doe@email.com">
                                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <!-- Birth Date -->
                            <div class="col-md-6 form-group">
                                <label for="birthDate" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                                <input type="date" id="birthDate" th:field="*{birthDate}" class="form-control">
                                <div class="text-danger" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
                            </div>
                        </div>

                        <!-- Course -->
                        <div class="form-group mt-3">
                            <label for="course" class="form-label">Course / Program Enrolled <span class="text-danger">*</span></label>
                            <select id="course" th:field="*{course}" class="form-select form-control">
                                <option value="" disabled selected>-- Select a course --</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Software Engineering">Software Engineering</option>
                                <option value="Data Science & AI">Data Science & AI</option>
                                <option value="Cyber Security">Cyber Security</option>
                                <option value="Business Administration">Business Administration</option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>
                        </div>

                        <div class="mt-4 pt-3 border-top border-light-subtle d-flex justify-content-end gap-2">
                            <a th:href="@{/students}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary d-inline-flex align-items-center gap-2">
                                <i class="bi bi-save-fill"></i> Save Student Record
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
