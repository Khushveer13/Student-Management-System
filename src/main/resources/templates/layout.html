<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(mainContent)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar">
            <div class="sidebar-brand">
                <i class="bi bi-mortarboard-fill"></i>
                <span>EduSphere</span>
            </div>
            
            <ul class="sidebar-menu">
                <li class="sidebar-item" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                    <a th:href="@{/dashboard}">
                        <i class="bi bi-grid-1x2-fill"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-item" th:classappend="${activePage == 'students' ? 'active' : ''}">
                    <a th:href="@{/students}">
                        <i class="bi bi-people-fill"></i>
                        <span>Students List</span>
                    </a>
                </li>
                <li class="sidebar-item" th:classappend="${activePage == 'add-student' ? 'active' : ''}">
                    <a th:href="@{/students/new}">
                        <i class="bi bi-person-plus-fill"></i>
                        <span>Add Student</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-profile-widget">
                    <div class="user-avatar">AD</div>
                    <div>
                        <div class="fw-semibold text-white" style="font-size: 0.9rem;">Administrator</div>
                        <div class="text-muted" style="font-size: 0.75rem;">admin@edusphere.com</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <main class="app-main">
            <!-- App Header -->
            <header class="app-header">
                <div>
                    <h5 class="m-0 fw-semibold" th:text="${pageTitle != null ? pageTitle : 'Portal'}">Portal</h5>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-secondary small fw-medium" th:text="${#temporals.format(#temporals.createNow(), 'EEEE, MMMM dd, yyyy')}">Date</span>
                    <div class="vr bg-secondary opacity-25" style="height: 20px;"></div>
                    <a th:href="@{/swagger-ui/index.html}" class="btn btn-sm btn-outline-success" target="_blank">
                        <i class="bi bi-journal-code me-1"></i> Swagger Docs
                    </a>
                    <a th:href="@{/api/students}" class="btn btn-sm btn-outline-primary" target="_blank">
                        <i class="bi bi-code-slash me-1"></i> REST API
                    </a>
                </div>
            </header>

            <!-- App Body (Dynamic Page Content) -->
            <div class="app-body animate-fade-in">
                <!-- Insert page specific content here -->
                <div th:replace="${mainContent}"></div>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 Bundle JS (Includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
